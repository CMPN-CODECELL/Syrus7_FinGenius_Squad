<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132719"/>
      <stop offset="0.45" stop-color="#294a2d"/>
      <stop offset="1" stop-color="#0d1d12"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="42%" r="70%">
      <stop offset="0" stop-color="#769b63" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#365c38" stop-opacity=".28"/>
      <stop offset="1" stop-color="#0b160e" stop-opacity=".85"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
    <g id="leaf">
      <path d="M0 0 C18 -22 42 -19 49 2 C29 8 13 12 0 0Z" fill="#6f955c" opacity=".9"/>
      <path d="M2 0 C19 -3 32 -6 47 1" stroke="#bdd09e" stroke-width="2" opacity=".55" fill="none"/>
    </g>
    <g id="rose">
      <circle r="25" fill="#d9a6a0" opacity=".92"/>
      <path d="M-22 0C-16-21 8-29 22-12C5-17-7-8-8 8C-2-7 11-14 24-3C18 17-10 25-22 0Z" fill="#f1c8bd"/>
      <path d="M-14 5C-10-7 3-13 14-5C8 0 4 8 6 17C-4 16-12 12-14 5Z" fill="#c78384" opacity=".8"/>
      <circle r="5" fill="#e8b95d"/>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- Soft forest bokeh -->
  <g filter="url(#blur)" opacity=".55">
    <circle cx="180" cy="170" r="120" fill="#789866"/>
    <circle cx="520" cy="120" r="90" fill="#d7b37b"/>
    <circle cx="760" cy="780" r="180" fill="#6c965f"/>
    <circle cx="1330" cy="210" r="150" fill="#567e4f"/>
    <circle cx="1180" cy="760" r="120" fill="#c0a276"/>
  </g>

  <!-- Main twisting flowering vines -->
  <g fill="none" stroke-linecap="round">
    <path d="M-80 790 C180 610 250 900 500 690 S820 420 1050 590 S1340 850 1690 570" stroke="#172f1c" stroke-width="38" opacity=".9"/>
    <path d="M-80 790 C180 610 250 900 500 690 S820 420 1050 590 S1340 850 1690 570" stroke="#71945e" stroke-width="13" opacity=".95"/>
    <path d="M-50 220 C190 330 240 120 470 300 S760 600 980 360 S1300 170 1680 350" stroke="#19361f" stroke-width="34" opacity=".9"/>
    <path d="M-50 220 C190 330 240 120 470 300 S760 600 980 360 S1300 170 1680 350" stroke="#7c9e67" stroke-width="11" opacity=".9"/>
    <path d="M420 1080 C530 850 490 650 650 500 S980 260 1160 -60" stroke="#102716" stroke-width="27" opacity=".85"/>
    <path d="M420 1080 C530 850 490 650 650 500 S980 260 1160 -60" stroke="#5e8756" stroke-width="9" opacity=".9"/>
  </g>

  <!-- Leaves -->
  <g>
    <use href="#leaf" transform="translate(155 675) rotate(-32) scale(1.25)"/>
    <use href="#leaf" transform="translate(285 790) rotate(48) scale(.95)"/>
    <use href="#leaf" transform="translate(470 700) rotate(-55) scale(1.15)"/>
    <use href="#leaf" transform="translate(630 585) rotate(30) scale(.95)"/>
    <use href="#leaf" transform="translate(795 520) rotate(-40) scale(1.2)"/>
    <use href="#leaf" transform="translate(1005 565) rotate(35) scale(1.1)"/>
    <use href="#leaf" transform="translate(1240 770) rotate(-25) scale(1.1)"/>
    <use href="#leaf" transform="translate(1450 660) rotate(38) scale(1.2)"/>
    <use href="#leaf" transform="translate(170 265) rotate(30) scale(1.1)"/>
    <use href="#leaf" transform="translate(360 245) rotate(-45) scale(1.2)"/>
    <use href="#leaf" transform="translate(575 385) rotate(50) scale(1)"/>
    <use href="#leaf" transform="translate(800 505) rotate(-30) scale(1.25)"/>
    <use href="#leaf" transform="translate(1040 340) rotate(42) scale(1.1)"/>
    <use href="#leaf" transform="translate(1280 235) rotate(-45) scale(1.1)"/>
    <use href="#leaf" transform="translate(1490 335) rotate(32) scale(1.15)"/>
  </g>

  <!-- Roses -->
  <g>
    <use href="#rose" transform="translate(245 690) scale(1.2)"/>
    <use href="#rose" transform="translate(520 665) scale(.82)"/>
    <use href="#rose" transform="translate(815 510) scale(1.15)"/>
    <use href="#rose" transform="translate(1090 610) scale(.9)"/>
    <use href="#rose" transform="translate(1360 735) scale(1.2)"/>
    <use href="#rose" transform="translate(335 250) scale(1.05)"/>
    <use href="#rose" transform="translate(650 430) scale(.78)"/>
    <use href="#rose" transform="translate(970 365) scale(1.08)"/>
    <use href="#rose" transform="translate(1260 250) scale(.86)"/>
    <use href="#rose" transform="translate(1510 355) scale(1.05)"/>
  </g>

  <!-- foreground haze -->
  <rect width="1600" height="1000" fill="#07120a" opacity=".16" filter="url(#soft)"/>
</svg>
